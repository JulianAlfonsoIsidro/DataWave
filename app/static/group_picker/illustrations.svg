  <rect x="24" y="23" width="7" height="7" rx="2" style="fill:var(--a)"/><rect x="33" y="23" width="7" height="7" rx="2" style="fill:var(--a)"/>
  <rect x="24" y="32" width="7" height="7" rx="2" style="fill:var(--a)"/><rect x="33" y="32" width="7" height="7" rx="2" style="fill:var(--a)"/>
  <path d="M29 51h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</symbol>
<symbol id="yn-frugal" viewBox="0 0 64 64">
