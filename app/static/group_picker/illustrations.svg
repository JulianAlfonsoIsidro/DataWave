  <circle cx="46" cy="50" r="4" fill="currentColor"/>
</symbol>
<symbol id="shop-1" viewBox="0 0 64 64"><use href="#shop-cart"/><rect x="31" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/></symbol>
<symbol id="shop-2" viewBox="0 0 64 64"><use href="#shop-cart"/><rect x="26" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="37" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/></symbol>
<symbol id="shop-3" viewBox="0 0 64 64"><use href="#shop-cart"/><rect x="22" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="32.5" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="43" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/></symbol>
<symbol id="shop-4" viewBox="0 0 64 64"><use href="#shop-cart"/><rect x="22" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="32.5" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="43" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="27" y="18.5" width="9" height="9" rx="1.5" style="fill:var(--a)"/></symbol>
<symbol id="shop-5" viewBox="0 0 64 64"><use href="#shop-cart"/><rect x="22" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="32.5" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="43" y="29" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="27" y="18.5" width="9" height="9" rx="1.5" style="fill:var(--a)"/><rect x="37.5" y="18.5" width="9" height="9" rx="1.5" style="fill:var(--a)"/></symbol>

<!-- yes/no columns: eight distinct icons -->
