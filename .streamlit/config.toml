# Theme colors sampled from the BPI website reference screenshot.
# The full stylesheet lives in app/styles.css (loaded once by app/theme.py);
# this block sets Streamlit's base theme so native widgets match.
#   PAN_RED_DEEP    #AE1319  deep primary red (BPI wordmark / LOGIN button)
#   PAN_RED_BRIGHT  #D8232A  lighter red (gradient end)
#   PAN_GOLD        #C9A227  small gold accent (used sparingly)
#   PAN_CHARCOAL    #2B2B2B  dark charcoal body text
[theme]
primaryColor = "#AE1319"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F8"
textColor = "#2B2B2B"
font = "sans serif"